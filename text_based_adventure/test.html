<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Navigation Bar with Dark Mode</title>
    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            transition: background-color 0.3s, color 0.3s;
        }
        .navbar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background-color: #333;
            color: white;
            padding: 10px 20px;
        }
        .navbar .menu,
        .navbar .title,
        .navbar .settings {
            flex: 1;
        }
        .navbar .menu {
            text-align: left;
            position: relative;
        }
        .navbar .title {
            text-align: center;
        }
        .navbar .settings {
            text-align: right;
        }
        .navbar a {
            color: white;
            text-decoration: none;
            padding: 0 10px;
        }
        .navbar a:hover {
            text-decoration: underline;
        }
        .menu-dropdown {
            display: none;
            position: absolute;
            left: 0;
            top: 100%;
            background-color: #444;
            color: white;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
            z-index: 1;
        }
        .menu-dropdown a {
            display: block;
            padding: 10px;
            color: white;
            text-decoration: none;
        }
        .menu-dropdown a:hover {
            background-color: #555;
        }
        .dark-mode {
            background-color: #121212;
            color: #e0e0e0;
        }
    </style>
</head>
<body>
    <div class="navbar">
        <div class="menu">
            <a href="javascript:void(0)" onclick="toggleMenu()">☰ Menu</a>
            <div class="menu-dropdown" id="menuDropdown">
                <a href="javascript:void(0)" onclick="toggleDarkMode()">Switch to Dark Mode</a>
            </div>
        </div>
        <div class="title">
            Chapter 1: Introduction
        </div>
        <div class="settings">
            <a href="#settings">⚙ Settings</a>
        </div>
    </div>

    <!-- Placeholder content to show the structure of the page -->
    <div style="padding: 20px;">
        <h1>Chapter 1: Introduction</h1>
        <p>Welcome to Chapter 1. This is the introduction to our topic.</p>
        <!-- Additional content can go here -->
    </div>

    <script>
        function toggleMenu() {
            const menuDropdown = document.getElementById('menuDropdown');
            menuDropdown.style.display = menuDropdown.style.display === 'block' ? 'none' : 'block';
        }

        function toggleDarkMode() {
            document.body.classList.toggle('dark-mode');
            const menuLink = document.querySelector('.menu-dropdown a');
            if (document.body.classList.contains('dark-mode')) {
                menuLink.textContent = 'Switch to Light Mode';
            } else {
                menuLink.textContent = 'Switch to Dark Mode';
            }
        }

        // Close the dropdown if the user clicks outside of it
        window.onclick = function(event) {
            if (!event.target.matches('.menu a')) {
                const dropdowns = document.getElementsByClassName('menu-dropdown');
                for (let i = 0; i < dropdowns.length; i++) {
                    const openDropdown = dropdowns[i];
                    if (openDropdown.style.display === 'block') {
                        openDropdown.style.display = 'none';
                    }
                }
            }
        }
    </script>
</body>
</html>
