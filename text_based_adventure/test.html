<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Typewriter Effect</title>
    <style>
        .prompt-description {
        margin-bottom: 20px;
        font-size: 1.5em;
        font-family: monospace; /* Optional: Gives a typewriter-like appearance */
        white-space: pre-wrap; /* Preserve whitespace */
    }

    .prompt-description .italic {
        font-style: italic;
    }

    </style>
</head>
<body>
    <div class="prompt-description"></div>
    <button onclick="startTyping()">Start Typing</button>

    <script>
        function startTyping() {
            const text = 'The man calms and walks away muttering about adventurers being up to no good. But he picks up a cup of wine from a tray and busies himself with drinking that instead of fighting you.<br><br><i>Gain Inspiration</i><br><br>As your would-be attacker walks off, you see that the half-orc who was speaking to him is staring at you. She approaches you.';
            const descriptionElement = document.querySelector('.prompt-description');
            typeWriter(text, descriptionElement, () => {
                console.log('Typing complete');
            });
        }

        function typeWriter(text, element, callback) {
            let i = 0;
            const speed = 25; // Speed in milliseconds

            function type() {
                if (i < text.length) {
                    if (text.charAt(i) === '<') {
                        const endIndex = text.indexOf('>', i);
                        if (endIndex !== -1) {
                            const tag = text.substring(i, endIndex + 1);
                            element.innerHTML += tag;
                            i = endIndex + 1;

                            // If it's an <i> tag, apply italics style
                            if (tag.toLowerCase() === '<i>') {
                                element.innerHTML += '<style= "font-stlye: italic;">';
                            } else if (tag.toLowerCase() === '</i>') {
                                element.innerHTML += '</style>';
                            }
                        } else {
                            element.innerHTML += text.charAt(i);
                            i++;
                        }
                    } else {
                        element.innerHTML += text.charAt(i);
                        i++;
                    }

                    setTimeout(type, speed);
                } else if (callback) {
                    callback();
                }
            }

            type();
        }
    </script>
</body>
</html>
