<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Dice Roller</title>
        <style>
            body {
                font-family: Arial, sans-serif;
                text-align: center;
                margin: 20px;
            }

            #dice-container {
                margin-top: 20px;
            }

            #dice-animation {
                width: 100px;
                height: 100px;
                display: block;
                margin: 0 auto;
                transform-origin: center;
            }

            @keyframes roll {
                0% { transform: rotateX(0) rotateY(0); }
                25% { transform: rotateX(90deg) rotateY(0); }
                50% { transform: rotateX(90deg) rotateY(90deg); }
                75% { transform: rotateX(180deg) rotateY(90deg); }
                100% { transform: rotateX(180deg) rotateY(180deg); }
            }

            #dice-animation.rolling {
                animation: roll 1.5s cubic-bezier(0.25, 1, 0.5, 1) infinite;
            }

            #dice-result {
                margin-top: 10px;
                font-size: 18px;
            }

            button {
                margin-top: 20px;
                padding: 10px 20px;
                font-size: 16px;
                background-color: #2d89ef;
                color: white;
                border: none;
                border-radius: 5px;
                cursor: pointer;
            }

            button:hover {
                background-color: #2163b5;
            }
        </style>
    </head>
    <body>
        <div id="dice-container">
            <svg id="dice-animation" viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
                <polygon points="50,5 90,25 90,75 50,95 10,75 10,25" fill="#2d89ef" stroke="#000" stroke-width="2"></polygon>
                <text x="50%" y="50%" text-anchor="middle" fill="white" font-size="20px" dy=".3em">20</text>
            </svg>
            <p id="dice-result" aria-live="polite"></p>
            <button id="roll-dice-btn">Roll Dice</button>
        </div>
        <script>
            const rollDiceBtn = document.getElementById('roll-dice-btn');
            const diceAnimation = document.getElementById('dice-animation');
            const diceResultText = document.querySelector('#dice-animation text');
            const diceResult = document.getElementById('dice-result');

            rollDiceBtn.addEventListener('click', () => {
                // Clear previous result and add rolling animation
                diceResultText.textContent = '';
                diceResult.textContent = '';
                diceAnimation.classList.add('rolling');

                // Simulate dice roll after animation duration
                setTimeout(() => {
                    diceAnimation.classList.remove('rolling'); // Stop animation
                    const result = rollDice(20); // Roll a d20
                    diceResultText.textContent = result; // Display result on the dice
                    diceResult.textContent = `You rolled a ${result}!`; // Update result text
                }, 1500); // Match this with animation timing
            });

            // Dice rolling logic
            function rollDice(sides = 20) {
                return Math.floor(Math.random() * sides) + 1;
            }
        </script>
    </body>
</html>
